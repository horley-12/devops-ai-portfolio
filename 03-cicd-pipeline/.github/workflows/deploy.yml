name: Deploy and Evaluate Lambda API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  FUNCTION_NAME: PlayerStatsAPI

jobs:

  validate:
    name: "1 — Validate IaC"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init (no backend)
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Checkov Security Scan
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true
          quiet: true

  test:
    name: "2 — Unit Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pytest boto3 "moto[dynamodb]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  deploy:
    name: "3 — Deploy to AWS"
    needs: [validate, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package Lambda
        run: zip function.zip lambda_function.py

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --zip-file fileb://function.zip \
            --region $AWS_REGION

      - name: Wait for update to complete
        run: |
          aws lambda wait function-updated \
            --function-name $FUNCTION_NAME

      - name: Smoke test
        run: |
          RESULT=$(aws lambda invoke \
            --function-name $FUNCTION_NAME \
            --payload '{"httpMethod":"GET","path":"/players/smoke-test","pathParameters":{"playerId":"smoke-test"}}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/response.json && cat /tmp/response.json)
          echo "Smoke test result: $RESULT"
          # Verify it's valid JSON
          echo $RESULT | python3 -m json.tool > /dev/null
          echo "Smoke test PASSED"

  report:
    name: "4 — Evaluation Report"
    needs: [validate, test, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate report
        run: |
          cat > report.md << 'EOF'
          # CI/CD Pipeline Evaluation Report

          **Run:** ${{ github.run_number }}
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}

          | Stage | Result | Criterion |
          |-------|--------|-----------|
          | IaC Validation | ${{ needs.validate.result }} | Terraform fmt + validate must pass |
          | Security Scan | ${{ needs.validate.result }} | No HIGH Checkov violations |
          | Unit Tests | ${{ needs.test.result }} | All moto/pytest tests green |
          | Deployment | ${{ needs.deploy.result }} | Lambda updated + smoke test passed |

          EOF
          cat report.md

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-evaluation-report-${{ github.run_number }}
          path: report.md
          retention-days: 30
