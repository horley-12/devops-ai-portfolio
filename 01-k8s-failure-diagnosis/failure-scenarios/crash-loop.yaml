apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crash-app
  template:
    metadata:
      labels:
        app: crash-app
    spec:
      containers:
      - name: crash-app
        image: nginx:latest
        command: ["/bin/sh", "-c", "echo starting && exit 1"]
