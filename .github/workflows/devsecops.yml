name: DevSecOps Security Pipeline

on:
  push:
    branches: [main]
    paths:
      - '06-devsecops-pipeline/**'
      - '.github/workflows/devsecops.yml'
  pull_request:
    branches: [main]

jobs:

  dependency-scan:
    name: "1 — Dependency Vulnerability Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Scan Lambda dependencies
        run: |
          echo "=== Scanning Lambda production dependencies ==="
          pip-audit -r 06-devsecops-pipeline/requirements.txt \
            --format json \
            --output pip-audit-results.json || true
          
          echo "=== Scan Summary ==="
          pip-audit -r 06-devsecops-pipeline/requirements.txt || true

      - name: Upload dependency scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit-results.json
          retention-days: 30

  image-scan:
    name: "2 — Container Image Vulnerability Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image for scanning
        run: |
          cat > 06-devsecops-pipeline/Dockerfile << 'DOCKERFILE'
          FROM python:3.12-slim
          WORKDIR /app
          COPY requirements.txt .
          RUN pip install -r requirements.txt
          COPY lambda_function.py .
          CMD ["python", "lambda_function.py"]
          DOCKERFILE
          
          docker build \
            -t devops-portfolio-lambda:scan \
            -f 06-devsecops-pipeline/Dockerfile \
            06-devsecops-pipeline/

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-portfolio-lambda:scan
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM
          output: trivy-results.txt

      - name: Display scan results
        run: |
          echo "=== Trivy Container Scan Results ==="
          cat trivy-results.txt

      - name: Run Trivy SARIF scan for GitHub Security tab
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-portfolio-lambda:scan
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container-scan

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-results
          path: |
            trivy-results.txt
            trivy-results.sarif
          retention-days: 30

  iac-security-scan:
    name: "3 — IaC Security Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov on all Terraform files
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: true
          quiet: true
          output_format: cli

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: 06-devsecops-pipeline/
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  security-report:
    name: "4 — Security Evaluation Report"
    needs: [dependency-scan, image-scan, iac-security-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate security report
        run: |
          cat > security-report.md << 'REPORT'
          # DevSecOps Security Evaluation Report

          **Run:** ${{ github.run_number }}
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          **Date:** ${{ github.event.repository.updated_at }}

          ## Pipeline Results

          | Stage | Tool | Result | Purpose |
          |-------|------|--------|---------|
          | 1 — Dependency Scan | pip-audit | ${{ needs.dependency-scan.result }} | CVEs in Python packages |
          | 2 — Image Scan | Trivy | ${{ needs.image-scan.result }} | CVEs in container image |
          | 3 — IaC Security | Checkov + Trivy fs | ${{ needs.iac-security-scan.result }} | Misconfigurations in Terraform |
          | 4 — Report | This report | Generated | Structured findings summary |

          ## Tools Used
          - **pip-audit:** Scans Python dependencies against PyPI Advisory Database
          - **Trivy (image):** Scans container layers for OS and library CVEs
          - **Trivy (filesystem):** Scans source code and configs for secrets and misconfigs
          - **Checkov:** Scans Terraform for security misconfigurations

          ## Security Philosophy
          All scans use exit-code 0 (non-blocking) to maintain deployment
          velocity while providing full security visibility. In production,
          CRITICAL findings would block the pipeline (exit-code 1).

          ## SARIF Report
          Container scan results uploaded to GitHub Security tab.
          View at: Security → Code scanning alerts
          REPORT
          
          cat security-report.md

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-evaluation-report-${{ github.run_number }}
          path: security-report.md
          retention-days: 30
